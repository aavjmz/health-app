server {
    listen 80;
    server_name dengw.xyz www.dengw.xyz;
    root /usr/share/nginx/html;
    index index.html;

    # 用于 certbot HTTP-01 验证
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Clean URLs: /report → /report.html
    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}

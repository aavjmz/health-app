<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TCM Constitution Report</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Lora:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F2F6F9;
  --surface:#fff;
  --surface2:#F7FAFB;
  --navy:#0F2B46;
  --primary:#2A7F6F;
  --primary-light:#E5F4F1;
  --accent:#E05C3A;
  --gold:#C09030;
  --gold-light:#FDF6E3;
  --text:#1A2B38;
  --text2:#4A6070;
  --text3:#8FA3B1;
  --border:#E2EBF0;
  --shadow:0 2px 20px rgba(15,43,70,.07);
  --shadow-lg:0 12px 48px rgba(15,43,70,.14);
  --r:20px;--rs:12px;
}
body{font-family:'Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* ── Layout ── */
.page{max-width:720px;margin:0 auto;padding:0 16px 80px}

/* ── Hero ── */
.hero{
position:relative;
background:var(--navy);
border-radius:0 0 32px 32px;
padding:52px 32px 48px;
color:#fff;
overflow:hidden;
margin-bottom:24px;
}
.hero-orb1{position:absolute;top:-80px;right:-80px;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(42,127,111,.35),transparent 70%)}
.hero-orb2{position:absolute;bottom:-60px;left:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(224,92,58,.2),transparent 70%)}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:32px;position:relative;z-index:1}
.hero-tag{display:inline-flex;align-items:center;gap:6px;font-size:11px;letter-spacing:1.5px;opacity:.6;border:1px solid rgba(255,255,255,.2);padding:5px 14px;border-radius:100px}
.hero-date{font-size:11px;opacity:.4;letter-spacing:1px}
.hero-body{position:relative;z-index:1}
.hero-label{font-size:11px;letter-spacing:2px;opacity:.5;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.hero-label::before{content:'';display:block;width:24px;height:1px;background:rgba(255,255,255,.4)}
.hero-name{font-family:'Lora',serif;font-size:clamp(40px,8vw,62px);font-weight:600;letter-spacing:3px;line-height:1.05;margin-bottom:12px}
.hero-name em{font-style:italic;opacity:.7;font-size:.55em;display:block;letter-spacing:4px;margin-bottom:4px}
.hero-tagline{font-size:13px;opacity:.65;letter-spacing:1px;line-height:1.7;margin-bottom:24px}
.hero-pills{display:flex;gap:10px;flex-wrap:wrap}
.hero-pill{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);border-radius:100px;padding:6px 16px;font-size:11px;letter-spacing:1px;backdrop-filter:blur(4px)}
.hero-pill.hl{background:rgba(42,127,111,.4);border-color:rgba(42,127,111,.5)}
.score-arc{
position:absolute;right:28px;bottom:40px;z-index:1;
width:80px;height:80px;
}
.score-arc svg{width:80px;height:80px}
.score-arc-text{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.score-arc-num{font-size:22px;font-weight:700;line-height:1}
.score-arc-lbl{font-size:9px;opacity:.5;letter-spacing:1px;margin-top:2px}

/* ── Section ── */
.section{margin-bottom:16px}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--border);overflow:hidden}
.card-head{padding:20px 24px 0}
.card-body{padding:20px 24px 24px}
.sec-title{font-size:12px;font-weight:600;letter-spacing:2px;color:var(--text3);text-transform:uppercase;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.sec-title-dot{width:6px;height:6px;border-radius:50%}

/* ── Symptom reflection ── */
.sym-list{display:flex;flex-direction:column;gap:10px}
.sym-item{
display:flex;align-items:flex-start;gap:12px;
background:var(--surface2);border-radius:var(--rs);
padding:14px 16px;border:1px solid var(--border);
}
.sym-icon{font-size:18px;flex-shrink:0;margin-top:1px}
.sym-text{font-size:13px;line-height:1.7;color:var(--text2)}
.sym-text strong{color:var(--text);font-weight:600}

/* ── TCM West dual column ── */
.dual{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:480px){.dual{grid-template-columns:1fr}}
.dual-card{border-radius:var(--rs);padding:18px;border:1px solid var(--border)}
.dual-card.tcm{background:var(--gold-light);border-color:#E8D080}
.dual-card.west{background:var(--primary-light);border-color:#B0D8D0}
.dual-label{font-size:10px;font-weight:700;letter-spacing:2px;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.dual-label.tcm-l{color:var(--gold)}
.dual-label.west-l{color:var(--primary)}
.dual-content{font-size:12.5px;line-height:1.9;color:var(--text2)}
.dual-content b{color:var(--text);font-weight:600}

/* ── Timeline ── */
.timeline{display:flex;flex-direction:column;gap:0}
.tl-item{display:flex;gap:16px;position:relative}
.tl-item:not(:last-child)::after{content:'';position:absolute;left:19px;top:40px;bottom:-8px;width:2px;background:linear-gradient(to bottom,var(--border),transparent)}
.tl-dot{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;border:2px solid var(--border);background:var(--surface)}
.tl-dot.active{border-color:var(--primary);background:var(--primary-light)}
.tl-content{padding-bottom:24px;flex:1}
.tl-phase{font-size:11px;font-weight:600;letter-spacing:1.5px;color:var(--text3);margin-bottom:4px}
.tl-title{font-size:15px;font-weight:600;color:var(--text);margin-bottom:8px}
.tl-items{display:flex;flex-direction:column;gap:6px}
.tl-row{font-size:12.5px;color:var(--text2);line-height:1.6;padding-left:12px;position:relative}
.tl-row::before{content:'';position:absolute;left:0;top:8px;width:4px;height:4px;border-radius:50%;background:var(--primary);opacity:.5}

/* ── Action cards ── */
.action-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:480px){.action-grid{grid-template-columns:1fr}}
.action-card{border-radius:var(--rs);padding:20px 16px;border:1px solid var(--border);position:relative;overflow:hidden}
.action-card::before{content:'';position:absolute;top:-20px;right:-20px;width:80px;height:80px;border-radius:50%;opacity:.12}
.action-card.ex{background:#F0FAF6;border-color:#B8E0D4}.action-card.ex::before{background:var(--primary)}
.action-card.diet{background:#FDF6F0;border-color:#F0D0B0}.action-card.diet::before{background:var(--accent)}
.action-card.life{background:#F4F0FA;border-color:#C8B8E8}.action-card.life::before{background:#7060B0}
.action-emoji{font-size:26px;margin-bottom:10px;display:block}
.action-type{font-size:10px;font-weight:700;letter-spacing:2px;color:var(--text3);margin-bottom:6px}
.action-main{font-size:13px;font-weight:600;color:var(--text);line-height:1.5;margin-bottom:8px}
.action-sub{font-size:11px;color:var(--text2);line-height:1.7}

/* ── Score chart ── */
.score-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:420px){.score-grid{grid-template-columns:1fr}}
.score-row{display:flex;flex-direction:column;gap:5px}
.score-top{display:flex;justify-content:space-between;align-items:center}
.score-name{font-size:12px;font-weight:500;color:var(--text)}
.score-num{font-size:11px;font-weight:700}
.score-track{height:5px;background:var(--border);border-radius:100px;overflow:hidden}
.score-fill{height:100%;border-radius:100px;transition:width 1.4s cubic-bezier(.4,0,.2,1)}

/* ── Secondary constitution ── */
.sec-const{background:var(--surface2);border-radius:var(--rs);padding:16px;border:1px solid var(--border);display:flex;gap:14px;align-items:flex-start}
.sec-badge{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.sec-info-name{font-size:14px;font-weight:600;margin-bottom:4px}
.sec-info-desc{font-size:12px;color:var(--text2);line-height:1.7}

/* ── Share bar ── */
.share-bar{
background:var(--navy);
border-radius:var(--r);
padding:24px;
color:#fff;
display:flex;align-items:center;justify-content:space-between;
gap:16px;flex-wrap:wrap;
}
.share-text h3{font-size:15px;font-weight:600;margin-bottom:4px}
.share-text p{font-size:12px;opacity:.55}
.share-btns{display:flex;gap:10px;flex-wrap:wrap}
.btn-share{padding:10px 20px;border-radius:100px;font-family:inherit;font-size:12px;font-weight:500;cursor:pointer;transition:all .2s;border:none}
.btn-share.primary{background:var(--primary);color:#fff}
.btn-share.primary:hover{background:#1E6B5D}
.btn-share.ghost{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.2)}
.btn-share.ghost:hover{background:rgba(255,255,255,.18)}

/* ── Animations ── */
.fade-up{opacity:0;transform:translateY(24px);transition:opacity .5s ease,transform .5s ease}
.fade-up.in{opacity:1;transform:none}

/* ── Print ── */
@media print{
body{background:#fff}
.share-bar,.btn-share{display:none}
.hero{border-radius:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.card{box-shadow:none;border:1px solid #ddd}
}

/* ── Divider ── */
.divider{height:1px;background:var(--border);margin:16px 0}

/* ── Tag ── */
.tag{display:inline-block;padding:4px 12px;border-radius:100px;font-size:11px;font-weight:500;border:1.5px solid;margin:3px}

/* ── Notice ── */
.notice{background:var(--gold-light);border:1px solid #E8D480;border-radius:var(--rs);padding:14px 18px;font-size:12px;color:#7A6010;line-height:1.9;margin-top:16px}

/* RTL */
[dir="rtl"] .hero-label::before{margin-left:8px;margin-right:0}
[dir="rtl"] .tl-row{padding-left:0;padding-right:12px}
[dir="rtl"] .tl-row::before{left:auto;right:0}
[dir="rtl"] .tl-item:not(:last-child)::after{left:auto;right:19px}
</style>

</head>

    westMech:{'zh-CN':'IgE介导的I型超敏反应过激，Th1/Th2严重偏向Th2；调节性T细胞（Treg）功能不足，免疫耐受建立障碍；肠道早期菌群定植异常（与剖宫产、抗生素使用相关）；遗传因素贡献率30-40%。','en':'IgE-mediated type-I hypersensitivity overactivation, severe Th1/Th2 imbalance toward Th2; insufficient regulatory T-cell (Treg) function, impaired immune tolerance; abnormal early gut microbiome colonization (associated with C-section delivery and antibiotic use); genetic factors contribute 30–40%.'},
    symptoms:{
      'zh-CN':[{q:'对花粉、灰尘、某些食物或药物容易过敏',explain:'IgE介导的I型超敏反应。Th2细胞过度活跃，IgE抗体大量产生，与肥大细胞结合后遇过敏原即释放组胺等炎症介质。'},{q:'季节变化或温差大时出现鼻痒、打喷嚏、皮肤瘙痒',explain:'卫气不固，外邪易侵。对应呼吸道黏膜IgE致敏，温差变化诱发肥大细胞脱颗粒，释放组胺和白三烯。'},{q:'有过敏性鼻炎、哮喘、湿疹等过敏性疾病史',explain:'特禀质的典型表现，提示全身性Th1/Th2失衡。Treg细胞功能不足使免疫系统无法对无害抗原建立耐受。'}],
      'en':[{q:'Easily allergic to pollen, dust, certain foods or medications',explain:'IgE-mediated type-I hypersensitivity. Th2 cells are overactive, producing large amounts of IgE antibodies; when bound to mast cells and encountering allergens, they release histamine and other inflammatory mediators.'},{q:'Nasal itching, sneezing, or skin itching during seasonal/temperature changes',explain:'Defensive Qi is unstable, pathogens invade easily. Corresponds to IgE sensitization of respiratory mucosa; temperature changes trigger mast cell degranulation, releasing histamine and leukotrienes.'},{q:'History of allergic rhinitis, asthma, eczema or other allergic diseases',explain:'Typical manifestation of Allergic Constitution, indicating systemic Th1/Th2 imbalance. Insufficient Treg cell function prevents the immune system from establishing tolerance to harmless antigens.'}],
    },
    phases:{
      'zh-CN':[{phase:'第1-30天',title:'固表止敏',icon:'🛡️',items:['记录过敏日记，找出所有诱发因素','每日食用含益生菌食品（酸奶）','玉屏风散开始服用（需咨询中医）']},{phase:'第31-60天',title:'调节免疫',icon:'⚖️',items:['户外运动加入，每周3次','减少家中尘螨（换洗床品频率增加）','益生菌坚持，评估过敏频率']},{phase:'第61-90天',title:'建立耐受',icon:'🌱',items:['评估过敏发作频率和程度','运动习惯已建立，持续维持','重新测评，关注过敏症状改善']}],
      'en':[{phase:'Days 1–30',title:'Strengthen Defenses',icon:'🛡️',items:['Keep an allergy journal; identify all triggers','Eat probiotic-containing foods daily (yogurt)','Start Jade Screen formula (consult a TCM practitioner)']},{phase:'Days 31–60',title:'Regulate Immunity',icon:'⚖️',items:['Add outdoor exercise, 3×/week','Reduce dust mites at home (wash bedding more frequently)','Continue probiotics; assess allergy frequency']},{phase:'Days 61–90',title:'Build Tolerance',icon:'🌱',items:['Assess allergy episode frequency and severity','Exercise habit is established — maintain it','Retake assessment; note improvement in allergy symptoms']}],
    },
    actions:{
      'zh-CN':{ex:{main:'户外有氧运动',sub:'每周3次，强度适中\n增加自然暴露，激活Treg'},diet:{main:'益生菌+玉屏风',sub:'每日酸奶+玉屏风散\n调节Th1/Th2平衡'},life:{main:'过敏日记+预防',sub:'记录诱发因素\n提前2-3周开始防护'}},
      'en':{ex:{main:'Outdoor Aerobic Exercise',sub:'3×/week, moderate intensity\nIncrease nature exposure, activate Treg'},diet:{main:'Probiotics + Jade Screen',sub:'Daily yogurt + Jade Screen formula\nRegulate Th1/Th2 balance'},life:{main:'Allergy Journal + Prevention',sub:'Record all triggers\nStart prevention 2–3 weeks early'}},
    },
  },
};

const CONST_ORDER=['qiXu','yangXu','yinXu','tanShi','shiRe','xueYu','qiYu','teBing'];

function getParams(){
  const p=new URLSearchParams(location.search);
  return{
    c: p.get('c')||'qiXu',
    c2: p.get('c2')||'',
    age: p.get('age')||'',
    ls: p.get('ls')||'',
    scores: (p.get('s')||'').split(',').map(Number),
    syms: (p.get('syms')||'').split(',').map(Number),
  };
}

function getLocalizedField(obj, field) {
  const lang = getLang();
  if (obj[field]) {
    if (typeof obj[field] === 'object' && !Array.isArray(obj[field])) {
      return obj[field][lang] || obj[field]['en'] || '';
    }
    return obj[field];
  }
  return '';
}

function renderPage(){
  const{c,c2,age,ls,scores,syms}=getParams();
  const CONSTS=getConsts();
  const lang=getLang();
  const data=REPORT_DB[c]||REPORT_DB.qiXu;
  const constInfo=CONSTS.find(x=>x.id===c)||CONSTS[0];
  const primaryScore=scores[CONST_ORDER.indexOf(c)]||65;
  const dateLocale=lang==='zh-CN'||lang==='zh-TW'?lang:'en-US';
  const date=new Date().toLocaleDateString(dateLocale,{year:'numeric',month:'long',day:'numeric'});

  const tagline=getLocalizedField(data,'tagline');
  const tcmMech=getLocalizedField(data,'tcmMech');
  const westMech=getLocalizedField(data,'westMech');
  const symptoms=data.symptoms[lang]||data.symptoms['en']||[];
  const phases=data.phases[lang]||data.phases['en']||[];
  const actions=data.actions[lang]||data.actions['en']||data.actions['zh-CN'];

  const highSyms=symptoms.filter((_,i)=>syms.includes(i));
  const showSyms=highSyms.length>0?highSyms:symptoms.slice(0,2);

  document.title=t('reportTitle');

  let html=`
  <!-- ① Hero -->
  <div class="hero fade-up">
    <div class="hero-orb1"></div>
    <div class="hero-orb2"></div>
    <div class="hero-top">
      <div class="hero-tag">${t('reportTag')}</div>
      <div class="hero-date">${date}</div>
    </div>
    <div class="hero-body">
      <div class="hero-label">${t('yourConst')}</div>
      <div class="hero-name">
        <em>${constInfo.icon}</em>
        ${constInfo.name}
      </div>
      <div class="hero-tagline">${tagline}</div>
      <div class="hero-pills">
        ${age?`<div class="hero-pill">${age}</div>`:''}
        ${ls?`<div class="hero-pill">${ls}</div>`:''}
        <div class="hero-pill hl">${t('deviationLbl')} ${primaryScore}%</div>
        ${c2&&REPORT_DB[c2]?`<div class="hero-pill">${getConsts().find(x=>x.id===c2)?.name||c2}</div>`:''}
      </div>
    </div>
    ${primaryScore?`
    <div class="score-arc">
      <svg viewBox="0 0 80 80">
        <circle cx="40" cy="40" r="34" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="6"/>
        <circle cx="40" cy="40" r="34" fill="none" stroke="${constInfo.color}" stroke-width="6"
          stroke-dasharray="${2*Math.PI*34}" stroke-dashoffset="${2*Math.PI*34*(1-primaryScore/100)}"
          stroke-linecap="round" transform="rotate(-90 40 40)" style="transition:stroke-dashoffset 1.5s ease"/>
      </svg>
      <div class="score-arc-text">
        <div class="score-arc-num">${primaryScore}</div>
        <div class="score-arc-lbl">${t('deviationLbl')}</div>
      </div>
    </div>`:''}
  </div>

  <!-- ② Symptoms -->
  <div class="section fade-up" style="animation-delay:.1s">
    <div class="card">
      <div class="card-head">
        <div class="sec-title"><div class="sec-title-dot" style="background:${constInfo.color}"></div>${t('bodySays')}</div>
      </div>
      <div class="card-body">
        <div class="sym-list">
          ${showSyms.map(s=>`
          <div class="sym-item">
            <div class="sym-icon">💬</div>
            <div class="sym-text">
              <strong>「${s.q}」</strong><br>
              ${s.explain}
            </div>
          </div>`).join('')}
        </div>
      </div>
    </div>
  </div>

  <!-- ③ TCM + West dual view -->
  <div class="section fade-up" style="animation-delay:.15s">
    <div class="card">
      <div class="card-head">
        <div class="sec-title"><div class="sec-title-dot" style="background:var(--gold)"></div>${t('dualTitle')}</div>
      </div>
      <div class="card-body">
        <div class="dual">
          <div class="dual-card tcm">
            <div class="dual-label tcm-l">${t('tcmLabel')}</div>
            <div class="dual-content">${tcmMech}</div>
          </div>
          <div class="dual-card west">
            <div class="dual-label west-l">${t('westLabel')}</div>
            <div class="dual-content">${westMech}</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ④ 90-day roadmap -->
  <div class="section fade-up" style="animation-delay:.2s">
    <div class="card">
      <div class="card-head">
        <div class="sec-title"><div class="sec-title-dot" style="background:var(--primary)"></div>${t('roadmapTitle')}</div>
      </div>
      <div class="card-body">
        <div class="timeline">
          ${phases.map((ph,i)=>`
          <div class="tl-item">
            <div class="tl-dot ${i===0?'active':''}">${ph.icon}</div>
            <div class="tl-content">
              <div class="tl-phase">${ph.phase}</div>
              <div class="tl-title">${ph.title}</div>
              <div class="tl-items">
                ${ph.items.map(it=>`<div class="tl-row">${it}</div>`).join('')}
              </div>
            </div>
          </div>`).join('')}
        </div>
      </div>
    </div>
  </div>

  <!-- ⑤ Action cards -->
  <div class="section fade-up" style="animation-delay:.25s">
    <div class="card">
      <div class="card-head">
        <div class="sec-title"><div class="sec-title-dot" style="background:var(--accent)"></div>${t('todayTitle')}</div>
      </div>
      <div class="card-body">
        <div class="action-grid">
          <div class="action-card ex">
            <span class="action-emoji">🏃</span>
            <div class="action-type">${t('exType')}</div>
            <div class="action-main">${actions.ex.main}</div>
            <div class="action-sub">${actions.ex.sub.replace(/\n/g,'<br>')}</div>
          </div>
          <div class="action-card diet">
            <span class="action-emoji">🥗</span>
            <div class="action-type">${t('dietType')}</div>
            <div class="action-main">${actions.diet.main}</div>
            <div class="action-sub">${actions.diet.sub.replace(/\n/g,'<br>')}</div>
          </div>
          <div class="action-card life">
            <span class="action-emoji">🌙</span>
            <div class="action-type">${t('lifeType')}</div>
            <div class="action-main">${actions.life.main}</div>
            <div class="action-sub">${actions.life.sub.replace(/\n/g,'<br>')}</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ⑥ Secondary constitution -->
  ${c2&&REPORT_DB[c2]?`
  <div class="section fade-up" style="animation-delay:.3s">
    <div class="card">
      <div class="card-head">
        <div class="sec-title"><div class="sec-title-dot" style="background:${CONSTS.find(x=>x.id===c2)?.color||'#888'}"></div>${t('secConstTitle')}</div>
      </div>
      <div class="card-body">
        <div class="sec-const">
          <div class="sec-badge" style="background:${CONSTS.find(x=>x.id===c2)?.light||'#eee'}">${CONSTS.find(x=>x.id===c2)?.icon||''}</div>
          <div class="sec-info">
            <div class="sec-info-name" style="color:${CONSTS.find(x=>x.id===c2)?.color||'#888'}">${CONSTS.find(x=>x.id===c2)?.name||c2}</div>
            <div class="sec-info-desc">${getLocalizedField(REPORT_DB[c2],'tagline')}. ${t('secConstDesc')}<b>${(REPORT_DB[c2].actions[lang]||REPORT_DB[c2].actions['en']||REPORT_DB[c2].actions['zh-CN']).life.main}</b>${t('secConstSuffix')}${CONSTS.find(x=>x.id===c2)?.name||c2}${t('secConstSuffix2')}</div>
          </div>
        </div>
      </div>
    </div>
  </div>`:''}

  <!-- ⑦ 8-dimension score -->
  <div class="section fade-up" style="animation-delay:.3s">
    <div class="card">
      <div class="card-head">
        <div class="sec-title"><div class="sec-title-dot" style="background:var(--gold)"></div>${t('scoreTitle')}</div>
      </div>
      <div class="card-body">
        <div class="score-grid">
          ${CONST_ORDER.map((id,i)=>{
            const d=CONSTS.find(x=>x.id===id)||{};
            const s=scores[i]||0;
            const col=s>=60?d.color:s>=35?(d.color+'99'):'#C8D8E4';
            return`<div class="score-row">
              <div class="score-top">
                <div class="score-name">${d.icon||''} ${d.name||id}</div>
                <div class="score-num" style="color:${col}">${s}%</div>
              </div>
              <div class="score-track"><div class="score-fill" id="sf${i}" style="background:${col};width:0%"></div></div>
            </div>`;
          }).join('')}
        </div>
      </div>
    </div>
  </div>

  <!-- ⑧ Share -->
  <div class="section fade-up" style="animation-delay:.35s">
    <div class="share-bar">
      <div class="share-text">
        <h3>${t('shareTitle')}</h3>
        <p>${t('shareSub')}</p>
      </div>
      <div class="share-btns">
        <button class="btn-share ghost" onclick="window.print()">${t('printBtn')}</button>
        <button class="btn-share primary" id="copyBtn" onclick="copyLink()">${t('copyBtn')}</button>
      </div>
    </div>
  </div>

  <div class="notice">${t('notice')}</div>
  `;

  document.getElementById('page').innerHTML=html;

  // inject lang switcher
  let sw=document.getElementById('langSwitcher');
  if(!sw){document.body.insertAdjacentHTML('beforeend',renderLangSwitcher());}
  else{sw.outerHTML=renderLangSwitcher();}

  setTimeout(()=>{
    document.querySelectorAll('.fade-up').forEach((el,i)=>{
      setTimeout(()=>el.classList.add('in'), i*80);
    });
  },100);

  setTimeout(()=>{
    CONST_ORDER.forEach((_,i)=>{
      const el=document.getElementById('sf'+i);
      if(el) el.style.width=(scores[i]||0)+'%';
    });
  },600);
}

function copyLink(){
  navigator.clipboard.writeText(location.href).then(()=>{
    const btn=document.getElementById('copyBtn');
    if(btn){btn.textContent=t('copied');setTimeout(()=>btn.textContent=t('copyBtn'),2000);}
  });
}

renderPage();
</script>

</body>
</html>

<!DOCTYPE html>

<html lang="zh-CN">
<head>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4136658490563590"
     crossorigin="anonymous"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="google-adsense-account" content="ca-pub-4136658490563590">
<title>TCM Constitution Report</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Lora:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F2F6F9;
  --surface:#fff;
  --surface2:#F7FAFB;
  --navy:#0F2B46;
  --primary:#2A7F6F;
  --primary-light:#E5F4F1;
  --accent:#E05C3A;
  --gold:#C09030;
  --gold-light:#FDF6E3;
  --text:#1A2B38;
  --text2:#4A6070;
  --text3:#8FA3B1;
  --border:#E2EBF0;
  --shadow:0 2px 20px rgba(15,43,70,.07);
  --shadow-lg:0 12px 48px rgba(15,43,70,.14);
  --r:20px;--rs:12px;
}
body{font-family:'Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* ── Layout ── */
.page{max-width:720px;margin:0 auto;padding:0 16px 80px}

/* ── Hero ── */
.hero{
position:relative;
background:var(--navy);
border-radius:0 0 32px 32px;
padding:52px 32px 48px;
color:#fff;
overflow:hidden;
margin-bottom:24px;
}
.hero-orb1{position:absolute;top:-80px;right:-80px;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(42,127,111,.35),transparent 70%)}
.hero-orb2{position:absolute;bottom:-60px;left:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(224,92,58,.2),transparent 70%)}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:32px;position:relative;z-index:1}
.hero-tag{display:inline-flex;align-items:center;gap:6px;font-size:11px;letter-spacing:1.5px;opacity:.6;border:1px solid rgba(255,255,255,.2);padding:5px 14px;border-radius:100px}
.hero-date{font-size:11px;opacity:.4;letter-spacing:1px}
.hero-body{position:relative;z-index:1}
.hero-label{font-size:11px;letter-spacing:2px;opacity:.5;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.hero-label::before{content:'';display:block;width:24px;height:1px;background:rgba(255,255,255,.4)}
.hero-name{font-family:'Lora',serif;font-size:clamp(40px,8vw,62px);font-weight:600;letter-spacing:3px;line-height:1.05;margin-bottom:12px}
.hero-name em{font-style:italic;opacity:.7;font-size:.55em;display:block;letter-spacing:4px;margin-bottom:4px}
.hero-tagline{font-size:13px;opacity:.65;letter-spacing:1px;line-height:1.7;margin-bottom:24px}
.hero-pills{display:flex;gap:10px;flex-wrap:wrap}
.hero-pill{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);border-radius:100px;padding:6px 16px;font-size:11px;letter-spacing:1px;backdrop-filter:blur(4px)}
.hero-pill.hl{background:rgba(42,127,111,.4);border-color:rgba(42,127,111,.5)}
.score-arc{
position:absolute;right:28px;bottom:40px;z-index:1;
width:80px;height:80px;
}
.score-arc svg{width:80px;height:80px}
.score-arc-text{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.score-arc-num{font-size:22px;font-weight:700;line-height:1}
.score-arc-lbl{font-size:9px;opacity:.5;letter-spacing:1px;margin-top:2px}

/* ── Section ── */
.section{margin-bottom:16px}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--border);overflow:hidden}
.card-head{padding:20px 24px 0}
.card-body{padding:20px 24px 24px}
.sec-title{font-size:12px;font-weight:600;letter-spacing:2px;color:var(--text3);text-transform:uppercase;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.sec-title-dot{width:6px;height:6px;border-radius:50%}

/* ── Symptom reflection ── */
.sym-list{display:flex;flex-direction:column;gap:10px}
.sym-item{
display:flex;align-items:flex-start;gap:12px;
background:var(--surface2);border-radius:var(--rs);
padding:14px 16px;border:1px solid var(--border);
}
.sym-icon{font-size:18px;flex-shrink:0;margin-top:1px}
.sym-text{font-size:13px;line-height:1.7;color:var(--text2)}
.sym-text strong{color:var(--text);font-weight:600}

/* ── TCM West dual column ── */
.dual{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:480px){.dual{grid-template-columns:1fr}}
.dual-card{border-radius:var(--rs);padding:18px;border:1px solid var(--border)}
.dual-card.tcm{background:var(--gold-light);border-color:#E8D080}
.dual-card.west{background:var(--primary-light);border-color:#B0D8D0}
.dual-label{font-size:10px;font-weight:700;letter-spacing:2px;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.dual-label.tcm-l{color:var(--gold)}
.dual-label.west-l{color:var(--primary)}
.dual-content{font-size:12.5px;line-height:1.9;color:var(--text2)}
.dual-content b{color:var(--text);font-weight:600}

/* ── Timeline ── */
.timeline{display:flex;flex-direction:column;gap:0}
.tl-item{display:flex;gap:16px;position:relative}
.tl-item:not(:last-child)::after{content:'';position:absolute;left:19px;top:40px;bottom:-8px;width:2px;background:linear-gradient(to bottom,var(--border),transparent)}
.tl-dot{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;border:2px solid var(--border);background:var(--surface)}
.tl-dot.active{border-color:var(--primary);background:var(--primary-light)}
.tl-content{padding-bottom:24px;flex:1}
.tl-phase{font-size:11px;font-weight:600;letter-spacing:1.5px;color:var(--text3);margin-bottom:4px}
.tl-title{font-size:15px;font-weight:600;color:var(--text);margin-bottom:8px}
.tl-items{display:flex;flex-direction:column;gap:6px}
.tl-row{font-size:12.5px;color:var(--text2);line-height:1.6;padding-left:12px;position:relative}
.tl-row::before{content:'';position:absolute;left:0;top:8px;width:4px;height:4px;border-radius:50%;background:var(--primary);opacity:.5}

/* ── Action cards ── */
.action-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:480px){.action-grid{grid-template-columns:1fr}}
.action-card{border-radius:var(--rs);padding:20px 16px;border:1px solid var(--border);position:relative;overflow:hidden}
.action-card::before{content:'';position:absolute;top:-20px;right:-20px;width:80px;height:80px;border-radius:50%;opacity:.12}
.action-card.ex{background:#F0FAF6;border-color:#B8E0D4}.action-card.ex::before{background:var(--primary)}
.action-card.diet{background:#FDF6F0;border-color:#F0D0B0}.action-card.diet::before{background:var(--accent)}
.action-card.life{background:#F4F0FA;border-color:#C8B8E8}.action-card.life::before{background:#7060B0}
.action-emoji{font-size:26px;margin-bottom:10px;display:block}
.action-type{font-size:10px;font-weight:700;letter-spacing:2px;color:var(--text3);margin-bottom:6px}
.action-main{font-size:13px;font-weight:600;color:var(--text);line-height:1.5;margin-bottom:8px}
.action-sub{font-size:11px;color:var(--text2);line-height:1.7}

/* ── Score chart ── */
.score-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:420px){.score-grid{grid-template-columns:1fr}}
.score-row{display:flex;flex-direction:column;gap:5px}
.score-top{display:flex;justify-content:space-between;align-items:center}
.score-name{font-size:12px;font-weight:500;color:var(--text)}
.score-num{font-size:11px;font-weight:700}
.score-track{height:5px;background:var(--border);border-radius:100px;overflow:hidden}
.score-fill{height:100%;border-radius:100px;transition:width 1.4s cubic-bezier(.4,0,.2,1)}

/* ── Secondary constitution ── */
.sec-const{background:var(--surface2);border-radius:var(--rs);padding:16px;border:1px solid var(--border);display:flex;gap:14px;align-items:flex-start}
.sec-badge{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.sec-info-name{font-size:14px;font-weight:600;margin-bottom:4px}
.sec-info-desc{font-size:12px;color:var(--text2);line-height:1.7}

/* ── Share bar ── */
.share-bar{
background:var(--navy);
border-radius:var(--r);
padding:24px;
color:#fff;
display:flex;align-items:center;justify-content:space-between;
gap:16px;flex-wrap:wrap;
}
.share-text h3{font-size:15px;font-weight:600;margin-bottom:4px}
.share-text p{font-size:12px;opacity:.55}
.share-btns{display:flex;gap:10px;flex-wrap:wrap}
.btn-share{padding:10px 20px;border-radius:100px;font-family:inherit;font-size:12px;font-weight:500;cursor:pointer;transition:all .2s;border:none}
.btn-share.primary{background:var(--primary);color:#fff}
.btn-share.primary:hover{background:#1E6B5D}
.btn-share.ghost{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.2)}
.btn-share.ghost:hover{background:rgba(255,255,255,.18)}

/* ── Animations ── */
.fade-up{opacity:0;transform:translateY(24px);transition:opacity .5s ease,transform .5s ease}
.fade-up.in{opacity:1;transform:none}

/* ── Print ── */
@media print{
body{background:#fff}
.share-bar,.btn-share{display:none}
.hero{border-radius:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.card{box-shadow:none;border:1px solid #ddd}
}

/* ── Divider ── */
.divider{height:1px;background:var(--border);margin:16px 0}

/* ── Tag ── */
.tag{display:inline-block;padding:4px 12px;border-radius:100px;font-size:11px;font-weight:500;border:1.5px solid;margin:3px}

/* ── Notice ── */
.notice{background:var(--gold-light);border:1px solid #E8D480;border-radius:var(--rs);padding:14px 18px;font-size:12px;color:#7A6010;line-height:1.9;margin-top:16px}

/* RTL */
[dir="rtl"] .hero-label::before{margin-left:8px;margin-right:0}
[dir="rtl"] .tl-row{padding-left:0;padding-right:12px}
[dir="rtl"] .tl-row::before{left:auto;right:0}
[dir="rtl"] .tl-item:not(:last-child)::after{left:auto;right:19px}

/* ── Save Banner ── */
.save-banner{background:linear-gradient(135deg,var(--accent),#C04828);border-radius:var(--r);padding:20px 24px;color:#fff;margin-bottom:16px;position:relative;overflow:hidden;animation:slideDown .4s ease}
.save-banner.return{background:var(--surface);border:1px solid var(--border);color:var(--text);box-shadow:var(--shadow)}
.save-banner-title{font-size:15px;font-weight:600;margin-bottom:6px}
.save-banner-sub{font-size:12px;opacity:.8;line-height:1.7;margin-bottom:14px}
.save-banner.return .save-banner-sub{color:var(--text2);opacity:1}
.save-banner-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn-copy-link{padding:10px 22px;border-radius:100px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;border:none;background:#fff;color:var(--accent);transition:all .2s}
.save-banner.return .btn-copy-link{background:var(--accent);color:#fff}
.btn-copy-link:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.15)}
.save-banner-dismiss{background:none;border:none;color:rgba(255,255,255,.7);font-size:12px;cursor:pointer;font-family:inherit}
.save-banner.return .save-banner-dismiss{color:var(--text3)}
@keyframes slideDown{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:none}}

/* ── Check-in Module ── */
.checkin-card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--border);overflow:hidden}
.checkin-header{padding:20px 24px 0;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.checkin-stats{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-top:10px}
.checkin-streak{font-size:13px;font-weight:600;color:var(--primary)}
.checkin-month{font-size:12px;color:var(--text3)}
.checkin-status{display:inline-flex;align-items:center;gap:6px;padding:5px 14px;border-radius:100px;font-size:11px;font-weight:600;letter-spacing:1px}
.checkin-status.perfect{background:#E5F4F1;color:var(--primary)}
.checkin-status.completed{background:#E5F4F1;color:var(--primary)}
.checkin-status.incomplete{background:var(--surface2);color:var(--text3)}
.checkin-body{padding:16px 24px 24px}
.checkin-items{display:flex;flex-direction:column;gap:10px}
.checkin-item{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:var(--rs);border:1.5px solid var(--border);cursor:pointer;transition:all .2s;background:var(--surface2);user-select:none}
.checkin-item:hover{border-color:var(--primary);background:var(--primary-light)}
.checkin-item.checked{border-color:var(--primary);background:var(--primary-light)}
.checkin-item.checked .checkin-check{background:var(--primary);border-color:var(--primary)}
.checkin-item.checked .checkin-check::after{content:'✓';color:#fff;font-size:12px;font-weight:700}
.checkin-item.checked .checkin-text-main{text-decoration:line-through;opacity:.6}
.checkin-check{width:22px;height:22px;border-radius:6px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s;background:var(--surface)}
.checkin-item.ex.checked{border-color:var(--primary);background:#F0FAF6}.checkin-item.ex.checked .checkin-check{background:var(--primary);border-color:var(--primary)}
.checkin-item.diet.checked{border-color:var(--accent);background:#FDF6F0}.checkin-item.diet.checked .checkin-check{background:var(--accent);border-color:var(--accent)}
.checkin-item.life.checked{border-color:#7060B0;background:#F4F0FA}.checkin-item.life.checked .checkin-check{background:#7060B0;border-color:#7060B0}
.checkin-emoji{font-size:20px;flex-shrink:0}
.checkin-text{flex:1}
.checkin-text-main{font-size:13px;font-weight:600;color:var(--text);line-height:1.5;transition:all .2s}
.checkin-text-sub{font-size:11px;color:var(--text2);margin-top:2px}

/* ── Calendar ── */
.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}
.cal-label{font-size:9px;color:var(--text3);text-align:center;font-weight:600;letter-spacing:1px;padding:4px 0}
.cal-day{aspect-ratio:1;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--text2)}
.cal-day.green{background:#D4EDDA;color:#1E6B3A;font-weight:600}
.cal-day.light-green{background:#E8F5E9;color:#4A7C59}
.cal-day.gray{background:var(--surface2);color:var(--text3)}
.cal-day.today{box-shadow:inset 0 0 0 2px var(--primary)}
.cal-day.future{opacity:.3}
.checkin-data-notice{font-size:11px;color:var(--text3);margin-top:14px;padding-top:12px;border-top:1px solid var(--border)}

/* Check-in print */
@media print{.save-banner,.checkin-card{display:none}}

/* Check-in RTL */
[dir="rtl"] .checkin-item{flex-direction:row-reverse}
[dir="rtl"] .checkin-header{flex-direction:row-reverse}
[dir="rtl"] .checkin-stats{flex-direction:row-reverse}
</style>
</head>
<body>
<div class="page" id="page">
  <!-- dynamically rendered -->
</div>

<script src="i18n.js"></script>
<script src="report-i18n.js"></script>
<script>
// Read URL lang param first, override stored lang if provided
(function(){
  const p=new URLSearchParams(location.search);
  const urlLang=p.get('lang');
  if(urlLang && SUPPORTED_LANGS.includes(urlLang)){
    window.__lang=urlLang;
    localStorage.setItem('lang',urlLang);
    document.documentElement.lang=urlLang;
    document.documentElement.dir=urlLang==='ar'?'rtl':'ltr';
  }
})();

function getParams(){
  const p=new URLSearchParams(location.search);
  return{
    c: p.get('c')||'qiXu',
    c2: p.get('c2')||'',
    age: p.get('age')||'',
    ls: p.get('ls')||'',
    scores: (p.get('s')||'').split(',').map(Number),
    syms: (p.get('syms')||'').split(',').map(Number),
    uid: p.get('uid')||'',
  };
}

function getLocalizedField(obj, field) {
  const lang = getLang();
  if (obj[field]) {
    if (typeof obj[field] === 'object' && !Array.isArray(obj[field])) {
      return obj[field][lang] || obj[field]['en'] || '';
    }
    return obj[field];
  }
  return '';
}

function renderPage(){
  const params=getParams();
  const{c,c2,age,ls,scores,syms}=params;
  // Resolve uid: URL param → localStorage → generate new
  let uid=params.uid;
  if(uid){localStorage.setItem('user_uid',uid);}else{uid=getOrCreateUid();}
  if(!params.uid){const u=new URL(location.href);u.searchParams.set('uid',uid);history.replaceState(null,'',u.toString());}
  const isReturn=!!localStorage.getItem('report_visited_'+uid);
  const CONSTS=getConsts();
  const lang=getLang();
  const data=REPORT_DB[c]||REPORT_DB.qiXu;
  const constInfo=CONSTS.find(x=>x.id===c)||CONSTS[0];
  const primaryScore=scores[CONST_ORDER.indexOf(c)]||65;
  const dateLocale=lang==='zh-CN'||lang==='zh-TW'?lang:'en-US';
  const date=new Date().toLocaleDateString(dateLocale,{year:'numeric',month:'long',day:'numeric'});

  const tagline=getLocalizedField(data,'tagline');
  const tcmMech=getLocalizedField(data,'tcmMech');
  const westMech=getLocalizedField(data,'westMech');
  const symptoms=data.symptoms[lang]||data.symptoms['en']||[];
  const phases=data.phases[lang]||data.phases['en']||[];
  const actions=data.actions[lang]||data.actions['en']||{};

  const highSyms=symptoms.filter((_,i)=>syms.includes(i));
  const showSyms=highSyms.length>0?highSyms:symptoms.slice(0,2);

  document.title=t('reportTitle');

  let html=`
  <!-- ① Hero -->
  <div class="hero fade-up">
    <div class="hero-orb1"></div>
    <div class="hero-orb2"></div>
    <div class="hero-top">
      <div class="hero-tag">${t('reportTag')}</div>
      <div class="hero-date">${date}</div>
    </div>
    <div class="hero-body">
      <div class="hero-label">${t('yourConst')}</div>
      <div class="hero-name">
        <em>${constInfo.icon}</em>
        ${constInfo.name}
      </div>
      <div class="hero-tagline">${tagline}</div>
      <div class="hero-pills">
        ${age?`<div class="hero-pill">${age}</div>`:''}
        ${ls?`<div class="hero-pill">${ls}</div>`:''}
        <div class="hero-pill hl">${t('deviationLbl')} ${primaryScore}%</div>
        ${c2&&REPORT_DB[c2]?`<div class="hero-pill">${getConsts().find(x=>x.id===c2)?.name||c2}</div>`:''}
      </div>
    </div>
    ${primaryScore?`
    <div class="score-arc">
      <svg viewBox="0 0 80 80">
        <circle cx="40" cy="40" r="34" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="6"/>
        <circle cx="40" cy="40" r="34" fill="none" stroke="${constInfo.color}" stroke-width="6"
          stroke-dasharray="${2*Math.PI*34}" stroke-dashoffset="${2*Math.PI*34*(1-primaryScore/100)}"
          stroke-linecap="round" transform="rotate(-90 40 40)" style="transition:stroke-dashoffset 1.5s ease"/>
      </svg>
      <div class="score-arc-text">
        <div class="score-arc-num">${primaryScore}</div>
        <div class="score-arc-lbl">${t('deviationLbl')}</div>
      </div>
    </div>`:''}
  </div>

  <!-- ①b Save Banner -->
  <div class="save-banner${isReturn?' return':''} fade-up" id="saveBanner" style="animation-delay:.05s">
    <div class="save-banner-title">${t('saveBannerTitle')}</div>
    <div class="save-banner-sub">${t('saveBannerSub')}</div>
    <div class="save-banner-actions">
      <button class="btn-copy-link" id="copyLinkBtn" onclick="copySaveLink()">${t('copyLinkBtn')}</button>
      ${isReturn?'<button class="save-banner-dismiss" onclick="dismissBanner()">'+t('dismissBtn')+'</button>':''}
    </div>
  </div>

  <!-- ② Symptoms -->
  <div class="section fade-up" style="animation-delay:.1s">
    <div class="card">
      <div class="card-head">
        <div class="sec-title"><div class="sec-title-dot" style="background:${constInfo.color}"></div>${t('bodySays')}</div>
      </div>
      <div class="card-body">
        <div class="sym-list">
          ${showSyms.map(s=>`
          <div class="sym-item">
            <div class="sym-icon">💬</div>
            <div class="sym-text">
              <strong>「${s.q}」</strong><br>
              ${s.explain}
            </div>
          </div>`).join('')}
        </div>
      </div>
    </div>
  </div>

  <!-- ③ TCM + West dual view -->
  <div class="section fade-up" style="animation-delay:.15s">
    <div class="card">
      <div class="card-head">
        <div class="sec-title"><div class="sec-title-dot" style="background:var(--gold)"></div>${t('dualTitle')}</div>
      </div>
      <div class="card-body">
        <div class="dual">
          <div class="dual-card tcm">
            <div class="dual-label tcm-l">${t('tcmLabel')}</div>
            <div class="dual-content">${tcmMech}</div>
          </div>
          <div class="dual-card west">
            <div class="dual-label west-l">${t('westLabel')}</div>
            <div class="dual-content">${westMech}</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ④ 90-day roadmap -->
  <div class="section fade-up" style="animation-delay:.2s">
    <div class="card">
      <div class="card-head">
        <div class="sec-title"><div class="sec-title-dot" style="background:var(--primary)"></div>${t('roadmapTitle')}</div>
      </div>
      <div class="card-body">
        <div class="timeline">
          ${phases.map((ph,i)=>`
          <div class="tl-item">
            <div class="tl-dot ${i===0?'active':''}">${ph.icon}</div>
            <div class="tl-content">
              <div class="tl-phase">${ph.phase}</div>
              <div class="tl-title">${ph.title}</div>
              <div class="tl-items">
                ${ph.items.map(it=>`<div class="tl-row">${it}</div>`).join('')}
              </div>
            </div>
          </div>`).join('')}
        </div>
      </div>
    </div>
  </div>

  <!-- ⑤ Action cards -->
  <div class="section fade-up" style="animation-delay:.25s">
    <div class="card">
      <div class="card-head">
        <div class="sec-title"><div class="sec-title-dot" style="background:var(--accent)"></div>${t('todayTitle')}</div>
      </div>
      <div class="card-body">
        <div class="action-grid">
          <div class="action-card ex">
            <span class="action-emoji">🏃</span>
            <div class="action-type">${t('exType')}</div>
            <div class="action-main">${actions.ex.main}</div>
            <div class="action-sub">${actions.ex.sub.replace(/\n/g,'<br>')}</div>
          </div>
          <div class="action-card diet">
            <span class="action-emoji">🥗</span>
            <div class="action-type">${t('dietType')}</div>
            <div class="action-main">${actions.diet.main}</div>
            <div class="action-sub">${actions.diet.sub.replace(/\n/g,'<br>')}</div>
          </div>
          <div class="action-card life">
            <span class="action-emoji">🌙</span>
            <div class="action-type">${t('lifeType')}</div>
            <div class="action-main">${actions.life.main}</div>
            <div class="action-sub">${actions.life.sub.replace(/\n/g,'<br>')}</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ⑤b Check-in -->
  ${renderCheckinSection(uid,actions)}

  <!-- ⑥ Secondary constitution -->
  ${c2&&REPORT_DB[c2]?`
  <div class="section fade-up" style="animation-delay:.3s">
    <div class="card">
      <div class="card-head">
        <div class="sec-title"><div class="sec-title-dot" style="background:${CONSTS.find(x=>x.id===c2)?.color||'#888'}"></div>${t('secConstTitle')}</div>
      </div>
      <div class="card-body">
        <div class="sec-const">
          <div class="sec-badge" style="background:${CONSTS.find(x=>x.id===c2)?.light||'#eee'}">${CONSTS.find(x=>x.id===c2)?.icon||''}</div>
          <div class="sec-info">
            <div class="sec-info-name" style="color:${CONSTS.find(x=>x.id===c2)?.color||'#888'}">${CONSTS.find(x=>x.id===c2)?.name||c2}</div>
            <div class="sec-info-desc">${getLocalizedField(REPORT_DB[c2],'tagline')}. ${t('secConstDesc')}<b>${((REPORT_DB[c2].actions[lang]||REPORT_DB[c2].actions['en']||{}).life||{}).main||''}</b>${t('secConstSuffix')}${CONSTS.find(x=>x.id===c2)?.name||c2}${t('secConstSuffix2')}</div>
          </div>
        </div>
      </div>
    </div>
  </div>`:''}

  <!-- ⑦ 8-dimension score -->
  <div class="section fade-up" style="animation-delay:.3s">
    <div class="card">
      <div class="card-head">
        <div class="sec-title"><div class="sec-title-dot" style="background:var(--gold)"></div>${t('scoreTitle')}</div>
      </div>
      <div class="card-body">
        <div class="score-grid">
          ${CONST_ORDER.map((id,i)=>{
            const d=CONSTS.find(x=>x.id===id)||{};
            const s=scores[i]||0;
            const col=s>=60?d.color:s>=35?(d.color+'99'):'#C8D8E4';
            return`<div class="score-row">
              <div class="score-top">
                <div class="score-name">${d.icon||''} ${d.name||id}</div>
                <div class="score-num" style="color:${col}">${s}%</div>
              </div>
              <div class="score-track"><div class="score-fill" id="sf${i}" style="background:${col};width:0%"></div></div>
            </div>`;
          }).join('')}
        </div>
      </div>
    </div>
  </div>

  <!-- ⑧ Share -->
  <div class="section fade-up" style="animation-delay:.35s">
    <div class="share-bar">
      <div class="share-text">
        <h3>${t('shareTitle')}</h3>
        <p>${t('shareSub')}</p>
      </div>
      <div class="share-btns">
        <button class="btn-share ghost" onclick="window.print()">${t('printBtn')}</button>
        <button class="btn-share primary" id="copyBtn" onclick="copyLink()">${t('copyBtn')}</button>
      </div>
    </div>
  </div>

  <div class="notice">${t('notice')}</div>
  `;

  document.getElementById('page').innerHTML=html;
  // Mark visited for banner state
  localStorage.setItem('report_visited_'+uid,'1');

  // inject lang switcher
  let sw=document.getElementById('langSwitcher');
  if(!sw){document.body.insertAdjacentHTML('beforeend',renderLangSwitcher());}
  else{sw.outerHTML=renderLangSwitcher();}

  setTimeout(()=>{
    document.querySelectorAll('.fade-up').forEach((el,i)=>{
      setTimeout(()=>el.classList.add('in'), i*80);
    });
  },100);

  setTimeout(()=>{
    CONST_ORDER.forEach((_,i)=>{
      const el=document.getElementById('sf'+i);
      if(el) el.style.width=(scores[i]||0)+'%';
    });
  },600);

  // Scroll to check-in section on return visit
  if(isReturn){
    setTimeout(()=>{
      const el=document.getElementById('checkinSection');
      if(el) el.scrollIntoView({behavior:'smooth',block:'start'});
    },500);
  }
}

function copyLink(){
  navigator.clipboard.writeText(location.href).then(()=>{
    const btn=document.getElementById('copyBtn');
    if(btn){btn.textContent=t('copied');setTimeout(()=>btn.textContent=t('copyBtn'),2000);}
  });
}

// ── Save Banner helpers ──
function copySaveLink(){
  navigator.clipboard.writeText(location.href).then(()=>{
    const btn=document.getElementById('copyLinkBtn');
    if(btn){btn.textContent=t('copied');setTimeout(()=>btn.textContent=t('copyLinkBtn'),2000);}
  });
}
function dismissBanner(){
  const el=document.getElementById('saveBanner');
  if(el) el.style.display='none';
}

// ── Check-in helpers ──
function fmtDate(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function todayKey(uid){return 'checkin_'+uid+'_'+fmtDate(new Date());}
function getCheckin(uid){
  const raw=localStorage.getItem(todayKey(uid));
  if(raw){try{return JSON.parse(raw);}catch(e){}}
  return{ex:false,diet:false,life:false};
}
function saveCheckin(uid,data){localStorage.setItem(todayKey(uid),JSON.stringify(data));}
function getCheckinCount(data){return[data.ex,data.diet,data.life].filter(Boolean).length;}
function getCheckinStatus(data){
  const n=getCheckinCount(data);
  return n>=3?'perfect':n>=2?'completed':'incomplete';
}
function getCheckinForDate(uid,dateStr){
  const raw=localStorage.getItem('checkin_'+uid+'_'+dateStr);
  if(raw){try{return JSON.parse(raw);}catch(e){}}
  return null;
}

function calcStreak(uid){
  let streak=0;
  const today=getCheckin(uid);
  const d=new Date();
  if(getCheckinCount(today)>=2){
    streak=1;
  }else{
    // today not done, check from yesterday
    d.setDate(d.getDate()-1);
    const data=getCheckinForDate(uid,fmtDate(d));
    if(!data||getCheckinCount(data)<2) return 0;
    streak=1;
  }
  const check=new Date(d);
  while(true){
    check.setDate(check.getDate()-1);
    const data=getCheckinForDate(uid,fmtDate(check));
    if(!data||getCheckinCount(data)<2) break;
    streak++;
  }
  return streak;
}

function calcMonthDays(uid){
  const now=new Date();
  let count=0;
  for(let day=1;day<=now.getDate();day++){
    const ds=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(day).padStart(2,'0');
    const data=getCheckinForDate(uid,ds);
    if(data&&getCheckinCount(data)>=2) count++;
  }
  return count;
}

function getCalendarData(uid){
  const days=[];
  const now=new Date();
  for(let i=29;i>=0;i--){
    const d=new Date(now);d.setDate(d.getDate()-i);
    const dateStr=fmtDate(d);
    const data=getCheckinForDate(uid,dateStr);
    const count=data?getCheckinCount(data):0;
    days.push({date:d,dateStr,count,isToday:i===0});
  }
  return days;
}

function calcItemRates(uid){
  const now=new Date();
  let total=0,exC=0,dietC=0,lifeC=0;
  for(let i=0;i<30;i++){
    const d=new Date(now);d.setDate(d.getDate()-i);
    const data=getCheckinForDate(uid,fmtDate(d));
    if(data){total++;if(data.ex)exC++;if(data.diet)dietC++;if(data.life)lifeC++;}
  }
  if(!total) return{total:0,ex:0,diet:0,life:0};
  return{total,ex:Math.round(exC/total*100),diet:Math.round(dietC/total*100),life:Math.round(lifeC/total*100)};
}

// Keep uid in module scope for toggle handler
let _currentUid='';

function toggleCheckin(uid,cat){
  const data=getCheckin(uid);
  data[cat]=!data[cat];
  saveCheckin(uid,data);
  updateCheckinUI(uid);
}

function updateCheckinUI(uid){
  const data=getCheckin(uid);
  const status=getCheckinStatus(data);
  // Update checkboxes
  document.querySelectorAll('.checkin-item').forEach(el=>{
    const key=el.classList.contains('ex')?'ex':el.classList.contains('diet')?'diet':'life';
    el.classList.toggle('checked',data[key]);
  });
  // Update status badge
  const badge=document.querySelector('.checkin-status');
  if(badge){
    badge.className='checkin-status '+status;
    badge.textContent=status==='perfect'?t('checkinPerfect'):status==='completed'?t('checkinCompleted'):t('checkinIncomplete');
  }
  // Update streak & month
  const streak=calcStreak(uid);
  const monthDays=calcMonthDays(uid);
  const statsEl=document.querySelector('.checkin-stats');
  if(statsEl){
    statsEl.innerHTML=
      (streak>0?'<div class="checkin-streak">🔥 '+t('streakLabel').replace('{n}',streak)+'</div>':'')+
      '<div class="checkin-month">📅 '+t('monthLabel').replace('{n}',monthDays)+'</div>';
  }
  // Update today's calendar cell
  document.querySelectorAll('.cal-day.today').forEach(el=>{
    const cnt=getCheckinCount(data);
    el.classList.remove('green','light-green','gray');
    el.classList.add(cnt>=2?'green':cnt>=1?'light-green':'gray');
  });
}

function renderCheckinSection(uid,actions){
  _currentUid=uid;
  const data=getCheckin(uid);
  const streak=calcStreak(uid);
  const monthDays=calcMonthDays(uid);
  const status=getCheckinStatus(data);
  const calData=getCalendarData(uid);
  const rates=calcItemRates(uid);

  const items=[
    {key:'ex',emoji:'🏃',cls:'ex',main:actions.ex.main,sub:(actions.ex.sub||'').split(/\n/)[0]},
    {key:'diet',emoji:'🥗',cls:'diet',main:actions.diet.main,sub:(actions.diet.sub||'').split(/\n/)[0]},
    {key:'life',emoji:'🌙',cls:'life',main:actions.life.main,sub:(actions.life.sub||'').split(/\n/)[0]},
  ];

  const statusLabel=status==='perfect'?t('checkinPerfect'):status==='completed'?t('checkinCompleted'):t('checkinIncomplete');

  // Calendar
  const weekdays=t('calWeekdays').split(',');
  let calHtml=weekdays.map(w=>'<div class="cal-label">'+w+'</div>').join('');
  const firstDow=calData[0].date.getDay();
  for(let i=0;i<firstDow;i++) calHtml+='<div class="cal-day"></div>';
  calData.forEach(d=>{
    const cls=d.isToday?' today':'';
    const colorCls=d.count>=2?' green':d.count>=1?' light-green':' gray';
    calHtml+='<div class="cal-day'+colorCls+cls+'">'+d.date.getDate()+'</div>';
  });

  // Rates (P2)
  let rateHtml='';
  if(rates.total>0){
    const cats=['ex','diet','life'];
    const lowest=cats.reduce((a,b)=>rates[a]<rates[b]?a:b);
    const typeKey=lowest==='ex'?'exType':lowest==='diet'?'dietType':'lifeType';
    rateHtml='<div style="font-size:11px;color:var(--text3);margin-top:12px">'+t('lowestRate')+': <b style="color:var(--text)">'+t(typeKey)+'</b> ('+rates[lowest]+'%)</div>';
  }

  return '<div class="section fade-up" style="animation-delay:.28s" id="checkinSection">'+
    '<div class="checkin-card">'+
      '<div class="checkin-header">'+
        '<div class="sec-title"><div class="sec-title-dot" style="background:var(--primary)"></div>'+t('checkinTitle')+'</div>'+
        '<div class="checkin-status '+status+'">'+statusLabel+'</div>'+
      '</div>'+
      '<div class="checkin-body">'+
        '<div class="checkin-stats">'+
          (streak>0?'<div class="checkin-streak">🔥 '+t('streakLabel').replace('{n}',streak)+'</div>':'')+
          '<div class="checkin-month">📅 '+t('monthLabel').replace('{n}',monthDays)+'</div>'+
        '</div>'+
        '<div class="checkin-items" style="margin-top:14px">'+
          items.map(it=>
            '<div class="checkin-item '+it.cls+(data[it.key]?' checked':'')+'" onclick="toggleCheckin(\''+uid+'\',\''+it.key+'\')">'+
              '<div class="checkin-check"></div>'+
              '<div class="checkin-emoji">'+it.emoji+'</div>'+
              '<div class="checkin-text">'+
                '<div class="checkin-text-main">'+it.main+'</div>'+
                '<div class="checkin-text-sub">'+it.sub+'</div>'+
              '</div>'+
            '</div>'
          ).join('')+
        '</div>'+
        '<div style="height:1px;background:var(--border);margin:20px 0 16px"></div>'+
        '<div style="font-size:12px;font-weight:600;color:var(--text2);letter-spacing:1px;margin-bottom:10px">'+t('calendarTitle')+'</div>'+
        '<div class="calendar-grid">'+calHtml+'</div>'+
        rateHtml+
        '<div class="checkin-data-notice">'+t('dataNotice')+'</div>'+
      '</div>'+
    '</div>'+
  '</div>';
}

renderPage();

// Midnight rollover: re-render if date changed while page was in background
let _lastDate=new Date().toDateString();
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden&&new Date().toDateString()!==_lastDate){
    _lastDate=new Date().toDateString();
    renderPage();
  }
});
</script>

<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TCM Constitution · Immunity Self-Assessment</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F0F4F8;--surface:#fff;--surface2:#F7F9FC;
  --primary:#2E7D6B;--primary-light:#E8F5F1;
  --accent:#E8614A;--navy:#1C3557;
  --text:#1A2B3C;--text2:#4A6070;--text3:#8FA3B1;
  --border:#E4ECF2;
  --shadow:0 2px 16px rgba(28,53,87,.07);
  --shadow-lg:0 8px 40px rgba(28,53,87,.13);
  --r:16px;--rs:10px;
}
body{font-family:'Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;top:-200px;right:-200px;width:600px;height:600px;background:radial-gradient(circle,rgba(46,125,107,.08) 0%,transparent 70%);pointer-events:none;z-index:0}
body::after{content:'';position:fixed;bottom:-200px;left:-200px;width:500px;height:500px;background:radial-gradient(circle,rgba(232,97,74,.06) 0%,transparent 70%);pointer-events:none;z-index:0}
.app{position:relative;z-index:1;max-width:680px;margin:0 auto;padding:0 16px 80px}

/* Header */
.header{text-align:center;padding:52px 24px 40px}
.header-chip{display:inline-flex;align-items:center;gap:6px;background:var(--primary-light);color:var(--primary);font-size:11px;font-weight:500;letter-spacing:1.5px;padding:6px 16px;border-radius:100px;margin-bottom:20px}
.header-chip::before{content:'●';font-size:7px}
.header h1{font-family:'Playfair Display',serif;font-size:clamp(30px,6vw,46px);color:var(--navy);line-height:1.15;margin-bottom:12px;letter-spacing:1px}
.header h1 em{font-style:normal;background:linear-gradient(135deg,var(--primary),#52B8A0);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header p{font-size:12.5px;color:var(--text3);line-height:1.9}

/* Progress */
.prog-area{padding:0 4px 24px}
.prog-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.prog-label{font-size:12px;color:var(--text2);font-weight:500}
.prog-pct{font-size:12px;color:var(--primary);font-weight:700}
.prog-track{height:4px;background:var(--border);border-radius:100px;overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(to right,var(--primary),#52B8A0);border-radius:100px;transition:width .5s cubic-bezier(.4,0,.2,1)}
.step-pills{display:flex;gap:4px;margin-top:12px;justify-content:center}
.pill{height:4px;border-radius:100px;background:var(--border);transition:all .3s;flex:1;max-width:32px}
.pill.active{background:var(--primary);max-width:24px}
.pill.done{background:rgba(46,125,107,.35)}

/* Card */
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:28px 24px;margin-bottom:16px;border:1px solid var(--border);animation:slideUp .35s cubic-bezier(.4,0,.2,1)}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}

/* Const header */
.ch{display:flex;align-items:center;gap:14px;padding-bottom:20px;margin-bottom:20px;border-bottom:1px solid var(--border)}
.ch-badge{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
.ch-name{font-size:18px;font-weight:700;margin-bottom:3px}
.ch-meta{font-size:11px;color:var(--text3);line-height:1.6}
.ch-counter{margin-left:auto;background:var(--surface2);border:1px solid var(--border);border-radius:100px;padding:4px 12px;font-size:11px;color:var(--text3);white-space:nowrap;flex-shrink:0}

/* Question */
.qi{margin-bottom:24px}
.qi:last-child{margin-bottom:0}
.q-text{font-size:14px;font-weight:500;color:var(--text);line-height:1.7;margin-bottom:12px}
.q-num{display:inline-block;width:22px;height:22px;border-radius:6px;background:var(--surface2);border:1px solid var(--border);font-size:11px;font-weight:700;color:var(--text3);text-align:center;line-height:22px;margin-right:8px;vertical-align:middle}
.opts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media(max-width:440px){.opts{grid-template-columns:repeat(2,1fr)}}
.opt{padding:10px 4px;border:1.5px solid var(--border);border-radius:var(--rs);background:var(--surface2);font-family:inherit;font-size:12.5px;color:var(--text2);cursor:pointer;text-align:center;transition:all .18s;font-weight:400;position:relative}
.opt:hover{border-color:var(--c,var(--primary));color:var(--c,var(--primary));background:var(--cl,var(--primary-light));transform:translateY(-1px)}
.opt.sel{background:var(--c,var(--primary));border-color:var(--c,var(--primary));color:#fff;font-weight:600;box-shadow:0 4px 12px rgba(0,0,0,.15);transform:translateY(-1px)}
.opt.sel::after{content:'✓';position:absolute;top:3px;right:5px;font-size:9px;opacity:.7}

/* Basic */
.basic-q{margin-bottom:28px}
.basic-label{font-size:14px;font-weight:500;color:var(--text);margin-bottom:12px}
.basic-opts{display:flex;flex-wrap:wrap;gap:10px}
.basic-btn{padding:10px 22px;border:1.5px solid var(--border);border-radius:100px;background:var(--surface2);font-family:inherit;font-size:13px;color:var(--text2);cursor:pointer;transition:all .18s}
.basic-btn:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-light)}
.basic-btn.sel{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:500}

/* Nav */
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:28px;padding-top:24px;border-top:1px solid var(--border)}
.btn-next{display:inline-flex;align-items:center;gap:8px;padding:13px 28px;background:linear-gradient(135deg,var(--primary),#38957F);color:#fff;border:none;border-radius:100px;font-family:inherit;font-size:14px;font-weight:500;cursor:pointer;transition:all .2s;box-shadow:0 4px 16px rgba(46,125,107,.3)}
.btn-next:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(46,125,107,.4)}
.btn-next:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.btn-back{display:inline-flex;align-items:center;gap:6px;padding:13px 22px;border:1.5px solid var(--border);border-radius:100px;background:transparent;font-family:inherit;font-size:13px;color:var(--text2);cursor:pointer;transition:all .2s}
.btn-back:hover{border-color:var(--text2);color:var(--text);background:var(--surface2)}

/* Results */
.result-hero{background:linear-gradient(135deg,var(--navy) 0%,#2A5F8F 100%);border-radius:var(--r);padding:40px 28px 36px;color:#fff;margin-bottom:16px;position:relative;overflow:hidden;box-shadow:var(--shadow-lg);animation:slideUp .4s ease}
.result-hero::before{content:'';position:absolute;top:-60px;right:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.04)}
.result-hero::after{content:'';position:absolute;bottom:-80px;left:-40px;width:260px;height:260px;border-radius:50%;background:rgba(46,125,107,.2)}
.r-eyebrow{font-size:11px;letter-spacing:2px;opacity:.55;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.r-eyebrow::before{content:'';display:block;width:20px;height:1px;background:rgba(255,255,255,.4)}
.r-name{font-family:'Playfair Display',serif;font-size:clamp(36px,7vw,56px);font-weight:700;letter-spacing:4px;line-height:1.1;margin-bottom:10px;position:relative;z-index:1}
.r-sub{font-size:13px;opacity:.7;letter-spacing:1px;margin-bottom:6px;position:relative;z-index:1}
.r-meta{font-size:11px;opacity:.45;letter-spacing:1px;position:relative;z-index:1}
.r-badge{position:absolute;top:28px;right:28px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:12px;padding:10px 16px;text-align:center;backdrop-filter:blur(8px)}
.r-badge-num{font-size:28px;font-weight:700;line-height:1}
.r-badge-lbl{font-size:10px;opacity:.6;margin-top:2px;letter-spacing:1px}

.rcard{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:24px;margin-bottom:12px;border:1px solid var(--border);animation:slideUp .4s ease}
.rcard-title{font-size:13px;font-weight:600;color:var(--text2);letter-spacing:1.5px;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.rcard-dot{width:8px;height:8px;border-radius:50%}
.desc-text{font-size:13px;line-height:2;color:var(--text2)}
.divider{height:1px;background:var(--border);margin:16px 0}
.sec-tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.sec-tag{padding:6px 16px;border-radius:100px;font-size:12px;font-weight:500;border:1.5px solid}

/* Score */
.score-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media(max-width:440px){.score-grid{grid-template-columns:1fr}}
.score-item{display:flex;flex-direction:column;gap:6px}
.score-top{display:flex;justify-content:space-between;align-items:center}
.score-name{font-size:12px;font-weight:500;color:var(--text)}
.score-val{font-size:11px;font-weight:700}
.score-track{height:5px;background:var(--border);border-radius:100px;overflow:hidden}
.score-bar{height:100%;border-radius:100px;transition:width 1.2s cubic-bezier(.4,0,.2,1);width:0%}

/* Advice */
.advice-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:500px){.advice-grid{grid-template-columns:1fr}}
.advice-col{background:var(--surface2);border-radius:var(--rs);padding:16px;border:1px solid var(--border)}
.advice-col h4{font-size:11px;font-weight:600;color:var(--primary);letter-spacing:1.5px;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.advice-col ul{list-style:none;padding:0}
.advice-col li{font-size:12px;line-height:1.8;color:var(--text2);padding:3px 0 3px 14px;position:relative;border-bottom:1px solid var(--border)}
.advice-col li:last-child{border-bottom:none}
.advice-col li::before{content:'';position:absolute;left:0;top:11px;width:5px;height:5px;border-radius:50%;background:var(--primary);opacity:.5}

.warning{background:#FFFBF0;border:1px solid #F0DC80;border-radius:var(--rs);padding:14px 18px;font-size:11.5px;color:#8B6914;line-height:1.9;margin-top:16px}
.retake-btn{display:block;width:100%;padding:14px;border:1.5px solid var(--border);border-radius:100px;background:transparent;font-family:inherit;font-size:13px;color:var(--text2);cursor:pointer;text-align:center;margin-top:16px;transition:all .2s}
.retake-btn:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-light)}
.simple-prog{display:flex;align-items:center;gap:10px;padding:16px 4px 20px}
.simple-step{font-size:12px;font-weight:600;color:var(--text2);white-space:nowrap;min-width:36px}
.simple-pct{font-size:12px;font-weight:700;color:var(--primary);white-space:nowrap;min-width:32px;text-align:right}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:2px;color:var(--text3);text-transform:uppercase;margin-bottom:20px;display:flex;align-items:center;gap:10px}
.eyebrow::after{content:'';flex:1;height:1px;background:var(--border)}

/* RTL support */
[dir="rtl"] .btn-back::before{content:'→'!important}
[dir="rtl"] .nav{flex-direction:row-reverse}
</style>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4136658490563590"
     crossorigin="anonymous"></script>
</head>
<body>
<div class="app">
  <div id="mainHeader" class="header">
    <div class="header-chip" id="headerChip"></div>
    <h1 id="headerH1"></h1>
    <p id="headerSub"></p>
  </div>
  <div id="progArea"></div>
  <div id="pages"></div>
</div>

<script src="i18n.js"></script>
<script>
let step=0,answers={},basic={};

function getTOTAL(){ return 1+getConsts().length; }

function calc(){
  const CONSTS=getConsts();
  const scores={};
  CONSTS.forEach(c=>{const t=c.qs.reduce((s,_,i)=>s+(answers[`${c.id}_${i}`]||0),0);scores[c.id]=Math.round(t/(c.qs.length*3)*100)});
  const sorted=Object.entries(scores).sort((a,b)=>b[1]-a[1]);
  return{scores,primary:sorted[0],secondary:sorted.slice(1,3).filter(([,v])=>v>=35),isBalanced:sorted[0][1]<30};
}

function updateHeader(){
  document.title=t('title');
  document.getElementById('headerChip').textContent=t('chip');
  document.getElementById('headerH1').innerHTML=t('h1a')+'<br><em>'+t('h1b')+'</em>';
  document.getElementById('headerSub').innerHTML=t('subtitle').replace('\n','<br>');
}

function updateProg(){
  const CONSTS=getConsts();
  const TOTAL=getTOTAL();
  const header=document.getElementById('mainHeader');
  const el=document.getElementById('progArea');
  if(step===0){
    header.style.display='';
    el.style.display='';
    el.innerHTML=`<div class="prog-area"><div class="prog-top"><span class="prog-label">${t('basicInfo')}</span><span class="prog-pct">0%</span></div><div class="prog-track"><div class="prog-fill" style="width:0%"></div></div><div class="step-pills">${Array.from({length:TOTAL},(_,i)=>`<div class="pill${i===0?' active':''}"></div>`).join('')}</div></div>`;
    return;
  }
  header.style.display='none';
  if(step>=TOTAL){el.style.display='none';return}
  const pct=Math.round(step/TOTAL*100);
  el.innerHTML=`<div class="simple-prog"><span class="simple-step">${step} ${t('stepOf')} ${CONSTS.length}</span><div class="prog-track" style="flex:1"><div class="prog-fill" style="width:${pct}%"></div></div><span class="simple-pct">${pct}%</span></div>`;
}

function renderBasic(){
  const BASIC=getBasic();
  const ok=BASIC.every(q=>basic[q.id]);
  return`<div class="card"><div class="eyebrow">${t('basicInfo')}</div>${BASIC.map(q=>`<div class="basic-q"><div class="basic-label">${q.q}</div><div class="basic-opts">${q.opts.map(o=>`<button class="basic-btn${basic[q.id]===o?' sel':''}" data-basic="${q.id}" data-val="${o}" onclick="pickB('${q.id}','${o.replace(/'/g,"&#39;")}')">${o}</button>`).join('')}</div></div>`).join('')}<div class="nav"><div></div><button id="nextBtn" class="btn-next" ${ok?'':'disabled'} onclick="goN()">${t('startBtn')}</button></div></div>`;
}

function renderConst(idx){
  const CONSTS=getConsts();
  const OPTS=getOpts();
  const c=CONSTS[idx];
  const done=c.qs.every((_,i)=>answers[`${c.id}_${i}`]!==undefined);
  const answered=c.qs.filter((_,i)=>answers[`${c.id}_${i}`]!==undefined).length;
  return`<div class="card"><div class="ch"><div class="ch-badge" style="background:${c.light}">${c.icon}</div><div><div class="ch-name" style="color:${c.color}">${c.name}</div><div class="ch-meta">${c.sum}<br>${c.west}</div></div><div id="counter" class="ch-counter">${answered}${t('stepOf')}${c.qs.length}</div></div>${c.qs.map((q,i)=>{const cur=answers[`${c.id}_${i}`];return`<div class="qi"><div class="q-text"><span class="q-num">${i+1}</span>${q}</div><div class="opts">${OPTS.map(o=>`<button class="opt${cur===o.v?' sel':''}" data-key="${c.id}_${i}" data-val="${o.v}" style="--c:${c.color};--cl:${c.light}" onclick="pickO('${c.id}',${i},${o.v})">${o.l}</button>`).join('')}</div></div>`}).join('')}<div class="nav"><button class="btn-back" onclick="goP()">${t('backBtn')}</button><button id="nextBtn" class="btn-next" ${done?'':'disabled'} onclick="goN()">${idx===CONSTS.length-1?t('resultBtn'):t('nextBtn')}</button></div></div>`;
}

function renderResults(){
  const CONSTS=getConsts();
  const DET=getDet();
  const{scores,primary,secondary,isBalanced}=calc();
  const pc=CONSTS.find(c=>c.id===primary[0]);
  const det=DET[primary[0]];
  let html=`<div class="result-hero"><div class="r-eyebrow">${t('reportTag')}</div><div class="r-name">${isBalanced?t('balanced'):pc.name}</div><div class="r-sub">${isBalanced?t('balancedSub'):pc.sum}</div><div class="r-meta">${basic.age||''} · ${basic.lifestyle||''}</div>${!isBalanced?`<div class="r-badge"><div class="r-badge-num">${primary[1]}</div><div class="r-badge-lbl">${t('deviationPct')}</div></div>`:''}</div>`;
  if(!isBalanced){
    html+=`<div class="rcard"><div class="rcard-title"><div class="rcard-dot" style="background:${pc.color}"></div>${t('analysisTitle')}</div><p class="desc-text">${det.desc}</p>${secondary.length?`<div class="divider"></div><div style="font-size:11px;color:var(--text3);margin-bottom:8px;letter-spacing:1px">${t('secondaryTitle')}</div><div class="sec-tags">${secondary.map(([id])=>{const c2=CONSTS.find(x=>x.id===id);return`<div class="sec-tag" style="border-color:${c2.color};color:${c2.color};background:${c2.light}">${c2.icon} ${c2.name}</div>`}).join('')}</div>`:''}</div>`;
    html+=`<div class="rcard"><div class="rcard-title"><div class="rcard-dot" style="background:var(--primary)"></div>${t('planTitle')}</div><div class="advice-grid"><div class="advice-col"><h4>${t('exerciseTitle')}</h4><ul>${det.ex.map(e=>`<li>${e}</li>`).join('')}</ul></div><div class="advice-col"><h4>${t('dietTitle')}</h4><ul>${det.di.map(d=>`<li>${d}</li>`).join('')}</ul></div><div class="advice-col"><h4>${t('lifeTitle')}</h4><ul>${det.li.map(l=>`<li>${l}</li>`).join('')}</ul></div></div></div>`;
  }
  html+=`<div class="rcard"><div class="rcard-title"><div class="rcard-dot" style="background:#B7770D"></div>${t('scoreTitle')}</div><div class="score-grid">${CONSTS.map(c=>{const s=scores[c.id]||0;const col=s>=60?c.color:s>=35?c.color+'AA':'#C8D8E4';return`<div class="score-item"><div class="score-top"><div class="score-name">${c.icon} ${c.name}</div><div class="score-val" style="color:${col}">${s}%</div></div><div class="score-track"><div class="score-bar" id="sb_${c.id}" style="background:${col}"></div></div></div>`}).join('')}</div></div>`;
  html+=`<div class="warning">${t('warning')}</div><button class="retake-btn" onclick="retake()">${t('retakeBtn')}</button>`;
  return html;
}

function render(){
  const CONSTS=getConsts();
  const TOTAL=getTOTAL();
  updateHeader();
  updateProg();
  // inject lang switcher
  let sw=document.getElementById('langSwitcher');
  if(!sw){document.body.insertAdjacentHTML('beforeend',renderLangSwitcher());}
  else{sw.outerHTML=renderLangSwitcher();}
  const p=document.getElementById('pages');
  if(step===0)p.innerHTML=renderBasic();
  else if(step<=CONSTS.length)p.innerHTML=renderConst(step-1);
  else{
    p.innerHTML=renderResults();
    const{scores}=calc();
    setTimeout(()=>CONSTS.forEach(c=>{const el=document.getElementById('sb_'+c.id);if(el)el.style.width=(scores[c.id]||0)+'%'}),150);
  }
}

function pickB(id,v){
  basic[id]=v;
  document.querySelectorAll(`[data-basic="${id}"]`).forEach(btn=>{
    btn.classList.toggle('sel', btn.dataset.val===v);
  });
  const BASIC=getBasic();
  const ok=BASIC.every(q=>basic[q.id]);
  const nextBtn=document.getElementById('nextBtn');
  if(nextBtn) nextBtn.disabled=!ok;
}

function pickO(id,qi,v){
  answers[`${id}_${qi}`]=v;
  document.querySelectorAll(`[data-key="${id}_${qi}"]`).forEach(btn=>{
    btn.classList.toggle('sel', +btn.dataset.val===v);
  });
  const CONSTS=getConsts();
  const c=CONSTS.find(x=>x.id===id);
  const answered=c.qs.filter((_,i)=>answers[`${id}_${i}`]!==undefined).length;
  const counter=document.getElementById('counter');
  if(counter) counter.textContent=`${answered}${t('stepOf')}${c.qs.length}`;
  const done=c.qs.every((_,i)=>answers[`${id}_${i}`]!==undefined);
  const nextBtn=document.getElementById('nextBtn');
  if(nextBtn) nextBtn.disabled=!done;
}

function goN(){
  const CONSTS=getConsts();
  const TOTAL=getTOTAL();
  window.scrollTo({top:0,behavior:'smooth'});
  if(step===TOTAL-1){
    const{scores,primary,secondary}=calc();
    const order=['qiXu','yangXu','yinXu','tanShi','shiRe','xueYu','qiYu','teBing'];
    const scoreStr=order.map(id=>scores[id]||0).join(',');
    const c2=secondary.length?secondary[0][0]:'';
    const c=CONSTS.find(x=>x.id===primary[0]);
    const symIdxs=c?c.qs.map((_,i)=>answers[`${c.id}_${i}`]>=2?i:-1).filter(x=>x>=0):[];
    const params=new URLSearchParams({
      c:primary[0],c2,age:basic.age||'',ls:basic.lifestyle||'',
      s:scoreStr,syms:symIdxs.join(','),lang:getLang()
    });
    window.location.href='report.html?'+params.toString();
    return;
  }
  step=Math.min(step+1,TOTAL);
  render();
}
function goP(){window.scrollTo({top:0,behavior:'smooth'});step=Math.max(0,step-1);render()}
function retake(){step=0;answers={};basic={};window.scrollTo({top:0,behavior:'smooth'});render()}

render();
</script>

</body>
</html>
